global:
  resolve_timeout: 5m
  # Descomente e preencha para enviar e-mail:
  # smtp_smarthost: "smtp.gmail.com:587"
  # smtp_from: "alertas@seudominio.com"
  # smtp_auth_username: "seu@email.com"
  # smtp_auth_password: "sua_senha_app"

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: "default"

  routes:
    - match:
        severity: critical
      receiver: "critico"
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: "default"
      repeat_interval: 4h

receivers:
  - name: "default"
    # webhook de exemplo (substitua pela URL do seu Slack/Discord/etc)
    webhook_configs:
      - url: "http://localhost:5001/webhook"
        send_resolved: true

  - name: "critico"
    webhook_configs:
      - url: "http://localhost:5001/webhook"
        send_resolved: true
    # email_configs:
    #   - to: "seutime@email.com"
    #     subject: "[CRÍTICO] {{ .GroupLabels.alertname }}"
    #     body: |
    #       {{ range .Alerts }}
    #       Alerta: {{ .Annotations.summary }}
    #       Detalhes: {{ .Annotations.description }}
    #       {{ end }}

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
