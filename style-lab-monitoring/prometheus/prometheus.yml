global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:

  # Prometheus se monitorando
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas do host (CPU, RAM, disco, rede)
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+)(:[0-9]+)?"
        replacement: "${1}"

  # Métricas dos containers Docker
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Aplicação de exemplo
  - job_name: "app"
    static_configs:
      - targets: ["app:8080"]
    metrics_path: /metrics
